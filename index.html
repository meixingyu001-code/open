<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>梅梅宇宙 · Life OS</title>
<style>
  /* =========================================================
     梅梅宇宙 · 生态画卷 v5 —— 一屏 · 横屏 · 入口散布 · 开窗不跳走
     点一个画卷地点 → 弹出一个窗口浮在生态图上，别的入口/窗口都还在
     白天 / 夜间可切。你要改的：
        ★白天/夜间背景插画（现在是占位色，见 .bg-day/.bg-night）
        ★地点入口的词、位置(top/left)、每个 app 的窗口内容(APPS)
     ========================================================= */
  :root{
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong",Georgia,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  .mmu{                         /* 白天默认 */
    --ink:#2c4430; --ink-soft:#557056; --faint:#8ba488;
    --bg-b:#0e241e; --bg-c:#a6cf9a;
    --glow:rgba(255,255,255,.92); --glow-edge:rgba(255,255,255,0); --orb-ink:#173f25;
    --win:rgba(255,255,255,.82); --win-line:rgba(40,56,43,.16); --win-bar:rgba(238,245,233,.9);
    position:fixed;inset:0;overflow:hidden;font-family:var(--serif);color:var(--ink);transition:color .6s}
  .mmu[data-theme="night"]{      /* 夜间 */
    --ink:#dce9d8; --ink-soft:#9db69a; --faint:#6f8a76; --orb-ink:#eaf3e6;
    --glow:rgba(206,234,210,.42); --glow-edge:rgba(206,234,210,0);
    --win:rgba(22,44,37,.82); --win-line:rgba(206,234,210,.2); --win-bar:rgba(16,34,28,.92)}

  /* 原创生态画卷背景：白天向外生长，夜间把阴影也包住 */
  .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s}
  .bg-day{background-image:linear-gradient(rgba(244,249,239,.03),rgba(183,211,171,.06)),url('assets/day-story.webp')}
  .bg-night{background-image:linear-gradient(rgba(5,20,16,.03),rgba(2,14,11,.16)),url('assets/night-story.webp');opacity:0}
  .mmu[data-theme="night"] .bg-day{opacity:0}
  .mmu[data-theme="night"] .bg-night{opacity:1}
  .bg::after{content:"";position:absolute;inset:0;opacity:.18;background:
    radial-gradient(1.5px 1.5px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 80% 60%,#fff,transparent),radial-gradient(1.5px 1.5px at 35% 75%,#fff,transparent),
    radial-gradient(1.5px 1.5px at 55% 48%,#fff,transparent)}

  .top{position:absolute;z-index:50;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.5rem 2.6rem}
  .brand-wrap{display:flex;flex-direction:column;gap:.28rem}
  .brand{font-family:var(--sans);font-size:.9rem;letter-spacing:.3em;color:var(--ink)}
  .brand-sub{font-family:var(--sans);font-size:.66rem;letter-spacing:.08em;color:var(--ink-soft)}
  .ctrl{display:flex;gap:.7rem}
  .ctrl button{font-family:var(--sans);font-size:.78rem;letter-spacing:.1em;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:2rem;padding:.42em 1em;backdrop-filter:blur(4px);transition:.25s}
  .ctrl button:hover{background:rgba(255,255,255,.34)}
  .mmu[data-theme="night"] .ctrl button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}

  /* 画卷入口 */
  .sky{position:absolute;inset:0;z-index:2}
  .star{position:absolute;transform:translate(-50%,-50%);text-decoration:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-width:clamp(92px,9vw,132px);min-height:clamp(40px,4vw,54px);border-radius:999px;
    padding:.45rem .65rem;color:var(--orb-ink);font-family:var(--serif);
    font-size:clamp(.9rem,1.15vw,1.1rem);letter-spacing:.08em;line-height:1.1;
    background:transparent;border:1px solid transparent;
    animation:float 7s ease-in-out infinite;transition:transform .3s,filter .3s,opacity .3s}
  .star::before{content:"";position:absolute;inset:8%;border-radius:999px;z-index:-1;opacity:0;
    background:radial-gradient(circle,rgba(255,255,236,.72),rgba(255,255,236,0) 70%);filter:blur(10px);transition:opacity .3s}
  .star .sigil{display:none}
  .star .label{position:relative;isolation:isolate;display:inline-block;font-weight:600;
    text-shadow:0 1px 1px rgba(255,255,255,.95),0 0 4px rgba(255,255,244,.92),0 2px 12px rgba(247,239,174,.74)}
  .mmu.tour-started .star .label{animation:labelAwaken .72s cubic-bezier(.2,.72,.28,1) var(--awake,0s) both}
  /* 白天的入口像恰好被阳光照到：没有框，只把字附近的纹理轻轻安静下来 */
  .mmu[data-theme="day"] .star .label::before{content:"";position:absolute;z-index:-1;inset:-.7em -1.05em;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,250,213,.78) 0%,rgba(255,247,195,.42) 42%,rgba(255,248,211,0) 74%);
    filter:blur(4px);opacity:.58;pointer-events:none}
  .mmu.tour-started[data-theme="day"] .star .label::before{animation:entranceAwaken 1.35s ease-out var(--awake,0s) both}
  /* 所有可点击地点共享一颗很小的金色星点，作为画卷里的交互暗号 */
  .mmu[data-theme="day"] .star .label::after{content:"";position:absolute;right:-.72em;top:48%;width:5px;height:5px;border-radius:50%;
    background:#c98e28;box-shadow:0 0 0 1px rgba(255,249,204,.82),0 0 9px 3px rgba(255,219,102,.72);
    transform:translateY(-50%);opacity:.92;pointer-events:none}
  .mmu.tour-started[data-theme="day"] .star .label::after{animation:entranceSpark 1.35s ease-out var(--awake,0s) both}
  .mmu:not(.tour-started) .star{opacity:.16;filter:blur(2px)}
  .star:hover{transform:translate(-50%,-50%) scale(1.07);filter:saturate(1.08)}
  .star:hover::before{opacity:1}
  .mmu[data-theme="day"] .star:hover .label::before{opacity:.9}
  .mmu[data-theme="day"] .star:hover .label::after{box-shadow:0 0 0 1px #fffbd7,0 0 13px 5px rgba(255,209,72,.88)}
  .star:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
  .hint{position:absolute;top:calc(100% + .38rem);left:50%;width:max-content;max-width:210px;padding:.48rem .68rem;border-radius:10px;
    font-family:var(--sans);font-size:.68rem;line-height:1.45;letter-spacing:.03em;font-weight:400;color:#f6f3df;text-align:left;
    background:rgba(25,57,38,.86);border:1px solid rgba(255,255,255,.22);box-shadow:0 8px 24px rgba(20,42,28,.18);backdrop-filter:blur(8px);
    opacity:0;pointer-events:none;transform:translate(-50%,5px);transition:opacity .2s,transform .2s}
  .star:hover .hint,.star:focus-visible .hint{opacity:1;transform:translate(-50%,0)}
  .s2 .hint,.s3 .hint,.s5 .hint,.s7 .hint{top:auto;bottom:calc(100% + .38rem)}
  .star.visited .label{filter:saturate(1.15)}
  .mmu[data-theme="day"] .star.visited .label::before{opacity:.94;background:radial-gradient(ellipse,rgba(255,247,169,.95),rgba(255,222,102,.42) 46%,rgba(255,248,211,0) 76%)}
  .mmu[data-theme="day"] .star.visited .label::after{background:#f1aa25;box-shadow:0 0 0 1px #fffbd8,0 0 15px 6px rgba(255,202,48,.86)}
  .mmu[data-theme="night"] .star.visited .label{text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 23px rgba(225,248,153,.95),0 0 42px rgba(161,223,123,.72)}
  .star.soon{color:var(--faint);font-size:.95rem}
  .star.soon:not(.unlocked){opacity:.38;filter:grayscale(.35);cursor:help}
  .star.soon.unlocked{opacity:1;filter:none}
  .mmu[data-theme="night"] .star{color:#e4efdc}
  .mmu[data-theme="night"] .star .label{font-weight:500;text-shadow:0 1px 9px rgba(2,10,8,.8),0 0 18px rgba(220,241,164,.52)}
  @keyframes float{0%,100%{margin-top:0}50%{margin-top:-12px}}
  @keyframes labelAwaken{0%{opacity:0;filter:blur(5px) brightness(1.8)}45%{opacity:1;filter:blur(0) brightness(1.35)}100%{opacity:1;filter:none}}
  @keyframes entranceAwaken{0%{opacity:.12;transform:scale(.65)}55%{opacity:1;transform:scale(1.13)}100%{opacity:.58;transform:scale(1)}}
  @keyframes entranceSpark{0%{opacity:0;transform:translateY(-50%) scale(.2)}55%{opacity:1;transform:translateY(-50%) scale(1.65)}100%{opacity:.92;transform:translateY(-50%) scale(1)}}
  @media (prefers-reduced-motion:reduce){.star,.star .label::before,.star .label::after{animation:none!important}}

  .s1{top:18%;left:19%;animation-delay:0s;--awake:.3s}.s1 .label{padding:.15rem .35rem;color:#244b27;transform:rotate(-5deg)}
  .s2{top:72%;left:16%;animation-delay:1.2s;--awake:.8s}.s2 .label{font-size:.95rem;color:#4b321f;transform:rotate(-3deg)}
  .s3{top:69%;left:60%;animation-delay:.6s;--awake:2.3s}.s3 .label{font-size:.92rem;letter-spacing:.14em;color:#1c4c47;transform:skewX(-8deg)}
  .s4{top:34%;left:85%;animation-delay:1.8s;--awake:1.3s}.s4 .label{font-family:var(--sans);font-size:.86rem;letter-spacing:.08em;color:#173f25;transform:rotate(9deg)}
  .s5{top:77%;left:82%;animation-delay:.9s;--awake:1.8s}.s5 .label{font-size:.95rem;color:#263e2b;transform:rotate(-18deg)}
  .s6{top:16%;left:67%;animation-delay:2.1s;--awake:2.8s}.s6 .label{font-size:.9rem;color:#526644;transform:rotate(5deg);text-shadow:0 1px 2px rgba(255,255,255,.98),0 0 7px rgba(255,252,220,.98),0 2px 14px rgba(244,224,128,.82)}
  .s7{top:75%;left:46%;animation-delay:1.5s;--awake:3.3s}.s7 .label{font-size:1.28rem;letter-spacing:.28em;color:#f4f6df;font-weight:500;transform:skewX(-10deg);text-shadow:0 2px 10px rgba(24,73,61,.96),0 0 20px rgba(255,255,230,.86)}
  .mmu[data-theme="night"] .s1 .label,.mmu[data-theme="night"] .s2 .label,.mmu[data-theme="night"] .s3 .label,
  .mmu[data-theme="night"] .s4 .label,.mmu[data-theme="night"] .s5 .label,.mmu[data-theme="night"] .s6 .label{color:#e4efdc}
  .mmu[data-theme="night"] .s7 .label{color:#f3f7dc;text-shadow:0 2px 12px rgba(0,0,0,.95),0 0 22px rgba(229,247,196,.86)}

  /* 不设入园门槛：把说明像题字一样留在草地上 */
  .garden-intro{position:absolute;z-index:3;top:25%;left:51%;width:min(370px,34vw);transform:translate(-50%,-50%);pointer-events:none;text-align:center;
    color:rgba(37,69,43,.78);text-shadow:0 1px 2px rgba(255,255,244,.98),0 0 12px rgba(255,255,225,.86)}
  .garden-intro strong{display:block;margin-bottom:.42rem;font-size:1.08rem;font-weight:400;letter-spacing:.14em}
  .garden-intro span{display:block;font-family:var(--sans);font-size:.72rem;line-height:1.8;letter-spacing:.05em}
  .mmu[data-theme="night"] .garden-intro{color:rgba(225,238,215,.82);text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 20px rgba(164,205,139,.35)}

  /* 会走的小梅梅：独立表现层，脚下坐标跟着画卷地点移动 */
  .walker{position:absolute;z-index:5;left:42%;top:79%;width:44px;height:88px;transform:translate(-50%,-100%);pointer-events:none;
    transition:left .88s cubic-bezier(.4,0,.2,1),top .88s cubic-bezier(.4,0,.2,1),width .88s,height .88s;filter:drop-shadow(0 5px 4px rgba(29,50,31,.18))}
  .walker-sprite{display:block;width:100%;height:100%;object-fit:contain;transform-origin:50% 90%;transition:transform .15s}
  .walker.facing-left .walker-sprite{transform:scaleX(-1)}
  .walker.walking{animation:walkerBob .32s ease-in-out infinite alternate}
  @keyframes walkerBob{to{margin-top:-3px}}

  .foot{position:absolute;z-index:3;bottom:1.35rem;left:50%;transform:translateX(-50%);white-space:nowrap;text-align:center;
    font-family:var(--sans);font-size:.74rem;letter-spacing:.14em;color:var(--ink-soft);padding:.42rem .78rem;border-radius:99px;
    background:rgba(246,250,242,.34);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px);text-shadow:0 1px 8px rgba(255,255,255,.8)}
  .mmu[data-theme="night"] .foot{background:rgba(7,23,18,.25);text-shadow:0 1px 8px rgba(0,0,0,.75)}

  /* 窗口 */
  .win{position:absolute;z-index:20;width:min(390px,86vw);max-height:calc(100vh - 96px);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;
    background:var(--win);border:1px solid var(--win-line);backdrop-filter:blur(12px);
    box-shadow:0 24px 60px rgba(20,40,30,.28);animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
  .win .bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;cursor:grab;
    padding:.7rem 1rem;background:var(--win-bar);border-bottom:1px solid var(--win-line)}
  .win .bar:active{cursor:grabbing}
  .win .ttl{font-family:var(--serif);font-size:1rem;letter-spacing:.03em;color:var(--ink)}
  .win .x{font-family:var(--sans);font-size:.95rem;line-height:1;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:.2em .4em;border-radius:6px}
  .win .x:hover{background:rgba(127,159,119,.2);color:var(--ink)}
  .win .body{padding:1.2rem 1.2rem 1.4rem;overflow-y:auto;font-size:.98rem;line-height:1.8;color:var(--ink)}
  .win .note{display:block;margin-top:.7rem;font-family:var(--sans);font-size:.8rem;color:var(--faint)}
  .win .kicker{font-family:var(--sans);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--faint)}
  .win .lead{margin:.35rem 0 1rem;font-size:1.02rem;line-height:1.65}
  .preview{padding:.85rem .9rem;border:1px solid var(--win-line);border-radius:12px;background:rgba(255,255,255,.18)}
  .preview+.preview{margin-top:.65rem}
  .preview-title{font-size:.95rem;line-height:1.5}
  .preview-meta{margin-top:.25rem;font-family:var(--sans);font-size:.72rem;color:var(--faint)}
  .trail{display:grid;gap:.55rem;margin-top:.3rem}
  .trail-row{display:grid;grid-template-columns:4.5rem 1fr;gap:.7rem;padding-bottom:.5rem;border-bottom:1px solid var(--win-line)}
  .trail-row:last-child{padding-bottom:0;border-bottom:0}.trail-key{font-family:var(--sans);font-size:.75rem;color:var(--faint)}
  .bubble{max-width:88%;padding:.65rem .8rem;border-radius:12px;background:rgba(127,159,119,.13);line-height:1.6}
  .bubble.me{margin-left:auto;background:rgba(255,255,255,.28)}.bubble+.bubble{margin-top:.55rem}
  .chatlog{display:flex;flex-direction:column;max-height:42vh;overflow-y:auto;padding-right:.2rem}
  .chat-prompts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}
  .prompt-chip{font-family:var(--sans);font-size:.72rem;line-height:1.35;color:var(--ink-soft);background:rgba(255,255,255,.18);border:1px solid var(--win-line);border-radius:99px;padding:.38rem .65rem;cursor:pointer}
  .prompt-chip:hover{color:var(--ink);background:rgba(127,159,119,.14)}
  .chatbar{display:flex;gap:.5rem;margin-top:.9rem}
  .chatbar input{flex:1;font-family:var(--sans);font-size:.9rem;color:var(--ink);background:rgba(255,255,255,.28);border:1px solid var(--win-line);border-radius:2rem;padding:.55em .9em;outline:none}
  .mmu[data-theme="night"] .chatbar input{background:rgba(255,255,255,.08)}
  .chatbar button{font-family:var(--sans);font-size:.85rem;color:var(--ink);background:rgba(127,159,119,.22);border:1px solid var(--win-line);border-radius:2rem;padding:.55em 1.1em;cursor:pointer}
  .chatbar button:disabled{opacity:.5;cursor:default}
  .bubble.typing{opacity:.6;font-style:italic}
  .quote{padding-left:.85rem;border-left:2px solid rgba(92,127,89,.38);font-size:1.02rem;line-height:1.75}
  .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.8rem}.tag{font-family:var(--sans);font-size:.7rem;color:var(--ink-soft);border:1px solid var(--win-line);border-radius:99px;padding:.2rem .55rem}
  .win .go{display:inline-block;margin-top:1rem;font-family:var(--sans);font-size:.85rem;letter-spacing:.06em;
    color:var(--ink);text-decoration:none;border:1px solid var(--win-line);border-radius:2rem;padding:.5em 1.2em}
  .win .go:hover{background:rgba(127,159,119,.14)}
  .win.phone{width:min(318px,82vw);border-radius:28px;border:1px solid rgba(255,255,255,.46)}
  .win.phone .bar{border-radius:27px 27px 0 0;padding:.62rem .92rem}
  .win.phone .body{padding:1.1rem 1.1rem 1.25rem}
  /* 个人主页本身按手机竖屏设计：始终保持 9:16，不因桌面高度被压扁 */
  .win.phone.embed{width:min(360px,88vw,calc(56.25vh - 80px));background:#080b09}
  .win.phone.embed .body{padding:0;overflow:hidden;background:#080b09}
  .site-frame{display:block;width:100%;height:auto;aspect-ratio:9 / 16;border:0;background:#080b09}

  @media (max-width:760px){
    .top{padding:1.2rem 1.4rem}
    .brand{letter-spacing:.2em}.brand-sub{display:none}
    .ctrl{gap:.45rem}.ctrl button{font-size:.72rem;padding:.38em .72em}
    .star{min-width:86px;min-height:38px;padding:.35rem .5rem;font-size:.78rem;letter-spacing:.04em}
    .s1{top:21%;left:22%}.s2{top:35%;left:22%}.s3{top:51%;left:73%}
    .s4{top:38%;left:75%}.s5{top:69%;left:30%}.s6{top:76%;left:72%}.s7{top:60%;left:55%}
    .s7 .label{font-size:1.08rem;letter-spacing:.2em}
    .hint{display:none}
    .garden-intro{top:14%;left:50%;width:72vw}.garden-intro strong{font-size:.9rem}.garden-intro span{font-size:.64rem;line-height:1.6}
    .walker{display:none}
    .foot{bottom:.9rem;font-size:.68rem;letter-spacing:.08em}
  }
</style>
</head>
<body>

<div class="mmu tour-started" id="mmu" data-theme="day">
  <div class="bg bg-day"></div>
  <div class="bg bg-night"></div>

  <header class="top">
    <div class="brand-wrap"><span class="brand">梅梅宇宙</span><span class="brand-sub">一场关于生活与创造的游园会</span></div>
    <div class="ctrl">
      <button id="theme" type="button">☾ 夜间</button>
    </div>
  </header>

  <div class="garden-intro" aria-label="游园介绍">
    <strong>这里是梅梅的游园会。</strong>
    <span>我把活过、想过、做过，以及还在长出来的东西放在这里。</span>
    <span>点开画面里的词，随便逛逛。</span>
  </div>

  <div class="sky" id="sky">
    <!-- ★ 画卷地点：data-app 对应下面 APPS 里的内容。复制一行即可加入口 -->
    <a class="star s1" data-app="wiki" href="#"><span class="label">人生 Wiki</span><span class="hint">沿着时间，看看我是怎么长到这里的</span></a>
    <a class="star s2" data-app="salon" href="#"><span class="label">问题沙龙</span><span class="hint">带一个真问题，来桌边坐坐</span></a>
    <a class="star s3" data-app="twin" href="#"><span class="label">数字分身</span><span class="hint">和另一个梅梅聊几句</span></a>
    <a class="star s4" data-app="life" href="#"><span class="label">Life OS</span><span class="hint">看看生活与创造如何在温室里运转</span></a>
    <a class="star s5" data-app="write" href="#"><span class="label">写作</span><span class="hint">沿着石径，读我留下来的话</span></a>
    <a class="star s6 soon" data-app="soon" href="#" aria-disabled="true"><span class="label">下一颗星</span><span class="hint">点亮六个地点后，桥的另一边会醒来</span></a>
    <a class="star s7" data-app="intro" href="#"><span class="label">梅梅</span><span class="hint">先来认识游园会的主人</span></a>
  </div>

  <div class="walker" id="walker" aria-hidden="true"><img class="walker-sprite" id="walker-sprite" src="assets/meimei-walk-4.webp" alt=""></div>

  <p class="foot" id="foot">把我带回自己身上。</p>
</div>

<script>
(function(){
  var mmu=document.getElementById('mmu'), sky=document.getElementById('sky'),
      walker=document.getElementById('walker'), walkerSprite=document.getElementById('walker-sprite');

  var CORE=['intro','wiki','write','salon','twin','life'], visited=[];
  try{ visited=JSON.parse(localStorage.getItem('mmu-visited-v1')||'[]'); }catch(e){ visited=[]; }
  if(!Array.isArray(visited)) visited=[];

  var WALK_FRAMES=['assets/meimei-walk-1.webp','assets/meimei-walk-2.webp','assets/meimei-walk-3.webp','assets/meimei-walk-4.webp'];
  var WALK_TO={intro:{x:42,y:79,s:44},wiki:{x:23,y:43,s:30},write:{x:78,y:79,s:44},salon:{x:18,y:78,s:44},twin:{x:58,y:71,s:40},life:{x:82,y:54,s:34},soon:{x:64,y:30,s:25}};
  var walkerX=42, walkerY=79, frameTimer=0, stopTimer=0;
  WALK_FRAMES.forEach(function(src){var img=new Image();img.src=src;});

  function walkTo(key){
    var p=WALK_TO[key]; if(!p||window.matchMedia('(max-width:760px), (prefers-reduced-motion:reduce)').matches) return;
    clearInterval(frameTimer);clearTimeout(stopTimer);
    walker.classList.toggle('facing-left',p.x<walkerX);
    walker.classList.add('walking');
    var frame=0;walkerSprite.src=WALK_FRAMES[0];
    frameTimer=setInterval(function(){frame=(frame+1)%WALK_FRAMES.length;walkerSprite.src=WALK_FRAMES[frame];},145);
    requestAnimationFrame(function(){walker.style.left=p.x+'%';walker.style.top=p.y+'%';walker.style.width=p.s+'px';walker.style.height=(p.s*2)+'px';});
    stopTimer=setTimeout(function(){clearInterval(frameTimer);walker.classList.remove('walking');walkerSprite.src=WALK_FRAMES[3];},920);
    walkerX=p.x;walkerY=p.y;
  }

  function saveVisited(){ try{ localStorage.setItem('mmu-visited-v1',JSON.stringify(visited)); }catch(e){} }
  function updateGarden(){
    sky.querySelectorAll('.star').forEach(function(s){
      s.classList.toggle('visited',visited.indexOf(s.getAttribute('data-app'))>-1);
    });
    var unlocked=CORE.every(function(k){return visited.indexOf(k)>-1;}), next=sky.querySelector('.s6');
    next.classList.toggle('unlocked',unlocked);
    next.setAttribute('aria-disabled',unlocked?'false':'true');
    next.querySelector('.hint').textContent=unlocked?'桥已经亮了，去看看下一颗星':'点亮六个地点后，桥的另一边会醒来';
  }
  function markVisited(key){
    if(CORE.indexOf(key)>-1&&visited.indexOf(key)<0){visited.push(key);saveVisited();updateGarden();}
  }
  updateGarden();

  // ★ 数字分身后端地址:部署好 Cloudflare Worker 后,把它的 https://xxx.workers.dev 填这里
  var TWIN_API="https://meimei-twin.meixingyu001.workers.dev";

  // ★ 每个软件窗口的内容：Demo 现场可以直接点开讲
  var APPS={
    intro:{t:'梅梅', phone:true, embed:true, b:'<iframe class="site-frame" src="https://personal-homepage-website-henna.vercel.app/" title="梅梅的个人主页" loading="eager"></iframe>'},
    wiki:{t:'人生 Wiki', b:'<div class="kicker">PRIVATE WIKI · 分类结构</div><p class="lead">我真的活过的证据，按这些类目长在一起。内容私密，这里只展示它的骨架。</p><div class="preview trail"><div class="trail-row"><span class="trail-key">编年史</span><span>按年份铺开的时间线</span></div><div class="trail-row"><span class="trail-key">人物</span><span>遇见过、影响过我的人</span></div><div class="trail-row"><span class="trail-key">项目</span><span>做过的事与它们的来龙去脉</span></div><div class="trail-row"><span class="trail-key">作品</span><span>写的、拍的、造的</span></div><div class="trail-row"><span class="trail-key">场域</span><span>待过的地方与它们的气味</span></div><div class="trail-row"><span class="trail-key">命题</span><span>反复回来的那几个问题</span></div><div class="trail-row"><span class="trail-key">模式</span><span>重复出现的行为与张力</span></div><div class="trail-row"><span class="trail-key">底层单位</span><span>人生切片与证据页</span></div></div>'},
    salon:{t:'问题沙龙', b:'<div class="kicker">会客厅 · QUESTION SALON</div><p class="lead">带着一个真问题，邀请有鲜明方法论的人一起学习、判断或创造。</p><div class="preview"><div class="preview-meta">下一张桌</div><div class="preview-title">开一张 Life OS 产品桌。请产品、技术、设计、营销领域里方法论差异鲜明的人来，用我目前的真实系统和材料过堂。</div></div><div class="tags"><span class="tag">自由之桌</span><span class="tag">钱之桌</span><span class="tag">不确定性之桌</span></div><a class="go" href="salon.html" target="_blank" rel="noopener">进入问题沙龙 ↗</a>'},
    twin:{t:'数字分身', b:'<div class="kicker">数字分身 · 先聊两句</div><p class="lead">我是数字梅梅，不是本人。想找梅梅聊之前，先跟我聊聊，感受一下合不合拍。私密的事我不聊，那得找真人。</p><div class="chatlog" id="twinlog"><div class="bubble">嗨，我是数字梅梅。你可以直接问，也可以从下面挑一句。</div></div><div class="chat-prompts" aria-label="示例问题"><button class="prompt-chip" type="button" data-prompt="Life OS 对梅梅来说是什么？">什么是 Life OS？</button><button class="prompt-chip" type="button" data-prompt="梅梅怎么看不上班和自由？">聊聊不上班</button><button class="prompt-chip" type="button" data-prompt="我适合找真人梅梅聊什么？">我适合找她聊什么？</button></div><form class="chatbar" id="twinform"><input id="twinput" autocomplete="off" placeholder="说点什么…"><button type="submit">发</button></form>'},
    write:{t:'写作', b:'<div class="kicker">WRITING ARCHIVE</div><p class="lead">已经做过的表达，不让它们沉在过期平台里。</p><div class="preview"><div class="preview-title">《想做一件不被理解的事情｜人生是旷野》</div><div class="preview-meta">2023 · 公众号随笔</div></div><div class="preview"><div class="preview-title">自由书写 1+1</div><div class="preview-meta">1.2 万字 · 7 日自由书写</div></div><div class="preview"><div class="preview-title">关于认知的 10+1 条暴论</div><div class="preview-meta">观点 / 感悟</div></div>'},
    life:{t:'Life OS', b:'<div class="kicker">GREENHOUSE / TOOL SHED</div><p class="lead">这里放的不是“我是谁”的结论，而是我怎么把这一切做出来。</p><div class="preview trail"><div class="trail-row"><span class="trail-key">底座</span><span>人生 Wiki、原话语料、证据页与冷库</span></div><div class="trail-row"><span class="trail-key">运转</span><span>数字分身、会客厅、灵感 Inbox、写作流水线</span></div><div class="trail-row"><span class="trail-key">方向</span><span>先服务于我，再成为作品，再成为对外产品</span></div></div><a class="go" href="talk.html" target="_blank" rel="noopener">打开 Life OS 演示 ↗</a>'},
    soon:{t:'下一颗星', b:'<div class="kicker">NEXT ORBIT</div><p class="lead">它还在长出来。</p><div class="preview trail"><div class="trail-row"><span class="trail-key">展陈</span><span>公开 Wiki 与人生地图</span></div><div class="trail-row"><span class="trail-key">互动</span><span>Builds 与连接入口</span></div></div>'},
    locked:{t:'桥的另一边', b:'<div class="kicker">THE BRIDGE IS SLEEPING</div><p class="lead">先去园子里走走吧。点亮梅梅、人生 Wiki、写作、问题沙龙、数字分身和 Life OS，桥的另一边才会醒来。</p>'}
  };

  var zTop=20, offset=0, openWins={};

  function raise(w){ w.style.zIndex=++zTop; }

  function openApp(key, sx, sy){
    if(openWins[key]){ raise(openWins[key]); return; }
    var a=APPS[key]; if(!a) return;
    var w=document.createElement('div'); w.className='win'+(a.phone?' phone':'')+(a.embed?' embed':'');
    w.innerHTML='<div class="bar"><span class="ttl">'+a.t+'</span><button class="x" aria-label="关闭">✕</button></div><div class="body">'+a.b+'</div>';
    // 在星球附近偏一点开；先放进页面测量，再确保整窗留在一屏内
    var nudge=offset%60; offset+=20;
    mmu.appendChild(w);
    var maxLeft=Math.max(16,window.innerWidth-w.offsetWidth-16);
    var maxTop=Math.max(72,window.innerHeight-w.offsetHeight-16);
    w.style.left=Math.min(Math.max(sx+nudge,16),maxLeft)+'px';
    w.style.top=Math.min(Math.max(sy+nudge,72),maxTop)+'px';
    openWins[key]=w; raise(w);
    w.addEventListener('mousedown', function(){ raise(w); });
    w.querySelector('.x').addEventListener('click', function(){ w.remove(); delete openWins[key]; });
    dragify(w, w.querySelector('.bar'));
    if(key==='twin') initTwin(w);
  }

  // 数字分身直播聊天:窗口内的输入框 → Worker → Workers AI
  function initTwin(w){
    var log=w.querySelector('#twinlog'), form=w.querySelector('#twinform'),
        inp=w.querySelector('#twinput'), btn=form.querySelector('button'), history=[];
    function add(role,text){
      var b=document.createElement('div');
      b.className='bubble'+(role==='user'?' me':'');
      b.textContent=text; log.appendChild(b); log.scrollTop=log.scrollHeight; return b;
    }
    w.querySelectorAll('.prompt-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        if(btn.disabled) return;
        inp.value=chip.getAttribute('data-prompt')||chip.textContent;
        btn.click();
      });
    });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var text=inp.value.trim(); if(!text) return;
      add('user',text); history.push({role:'user',content:text});
      inp.value=''; inp.focus(); btn.disabled=true;
      if(!TWIN_API){ add('assistant','(分身马上接上线,先喝口水~)'); btn.disabled=false; return; }
      var typing=add('assistant','数字梅梅正在想…'); typing.classList.add('typing');
      fetch(TWIN_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})})
        .then(function(r){return r.json();})
        .then(function(d){
          typing.remove();
          var reply=d.reply||d.error||'……(卡了一下,再说一次?)';
          add('assistant',reply); history.push({role:'assistant',content:reply});
        })
        .catch(function(){ typing.remove(); add('assistant','(我这边断线了,待会儿再聊?)'); })
        .finally(function(){ btn.disabled=false; });
    });
  }

  // 拖拽标题栏
  function dragify(w, bar){
    var down=false, ox=0, oy=0;
    bar.addEventListener('mousedown', function(e){
      if(e.target.classList.contains('x')) return;
      down=true; ox=e.clientX-w.offsetLeft; oy=e.clientY-w.offsetTop; e.preventDefault();
    });
    window.addEventListener('mousemove', function(e){
      if(!down) return; w.style.left=(e.clientX-ox)+'px'; w.style.top=(e.clientY-oy)+'px';
    });
    window.addEventListener('mouseup', function(){ down=false; });
  }

  sky.addEventListener('click', function(e){
    var s=e.target.closest('.star'); if(!s) return; e.preventDefault();
    var r=s.getBoundingClientRect(), key=s.getAttribute('data-app');
    if(key==='soon'&&!s.classList.contains('unlocked')){openApp('locked',r.right-10,r.top);return;}
    markVisited(key);
    walkTo(key);
    openApp(key,r.right-10,r.top);
  });

  // 白天 / 夜间
  var tb=document.getElementById('theme');
  tb.addEventListener('click', function(){
    var night=mmu.getAttribute('data-theme')==='night';
    mmu.setAttribute('data-theme', night?'day':'night');
    tb.textContent=night?'☾ 夜间':'☀ 白天';
  });
})();
</script>
