<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>梅梅宇宙 · Life OS(手机版)</title>
<style>
  /* =========================================================
     梅梅宇宙 · 手机版 —— 花园背景/星球和桌面版一致，
     点开星球后不是浮动窗口，是从底部弹出的面板（bottom sheet）。
     和 index.html(桌面版)是两个独立文件，样式/内容大段复制，
     只有"窗口→sheet"这一层交互不同。改内容/文案请两边一起改。
     ========================================================= */
  :root{
    --serif:"Songti SC","Source Han Serif SC","Noto Serif SC","STSong",Georgia,serif;
    --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}

  .mmu{
    --ink:#2c4430; --ink-soft:#557056; --faint:#8ba488;
    --win:rgba(255,255,255,.86); --win-line:rgba(40,56,43,.16); --win-bar:rgba(238,245,233,.9);
    --orb-ink:#173f25;
    position:fixed;inset:0;overflow:hidden;font-family:var(--serif);color:var(--ink);transition:color .6s}
  .mmu[data-theme="night"]{
    --ink:#dce9d8; --ink-soft:#9db69a; --faint:#6f8a76; --orb-ink:#eaf3e6;
    --win:rgba(22,44,37,.88); --win-line:rgba(206,234,210,.2); --win-bar:rgba(16,34,28,.92)}

  .bg{position:absolute;inset:0;background-size:cover;background-position:center;transition:opacity .6s}
  .bg-day{background-image:linear-gradient(rgba(244,249,239,.03),rgba(183,211,171,.06)),url('assets/day-story.webp')}
  .bg-night{background-image:linear-gradient(rgba(5,20,16,.03),rgba(2,14,11,.16)),url('assets/night-story.webp');opacity:0}
  .mmu[data-theme="night"] .bg-day{opacity:0}
  .mmu[data-theme="night"] .bg-night{opacity:1}

  .top{position:absolute;z-index:10;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:1.2rem 1.4rem}
  .brand-wrap{display:flex;flex-direction:column;gap:.2rem}
  .brand{font-family:var(--sans);font-size:.86rem;letter-spacing:.2em;color:var(--ink)}
  .ctrl{display:flex;gap:.45rem}
  .ctrl button{font-family:var(--sans);font-size:.72rem;letter-spacing:.08em;color:var(--ink);cursor:pointer;
    background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.35);border-radius:2rem;padding:.38em .72em;backdrop-filter:blur(4px)}
  .mmu[data-theme="night"] .ctrl button{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2)}

  /* 星球:坐标沿用桌面版手机断点里已经调好的那套 */
  .sky{position:absolute;inset:0;z-index:2}
  .star{position:absolute;transform:translate(-50%,-50%);text-decoration:none;
    display:flex;align-items:center;justify-content:center;text-align:center;
    min-width:86px;min-height:38px;border-radius:999px;padding:.35rem .5rem;
    color:var(--orb-ink);font-family:var(--serif);font-size:.78rem;letter-spacing:.04em;line-height:1.1;
    animation:float 7s ease-in-out infinite}
  .star .label{position:relative;isolation:isolate;display:inline-block;font-weight:600;
    text-shadow:0 1px 1px rgba(255,255,255,.95),0 0 4px rgba(255,255,244,.92),0 2px 12px rgba(247,239,174,.74)}
  .mmu[data-theme="day"] .star .label::before{content:"";position:absolute;z-index:-1;inset:-.7em -1.05em;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,250,213,.78) 0%,rgba(255,247,195,.42) 42%,rgba(255,248,211,0) 74%);
    filter:blur(4px);opacity:.58}
  .mmu[data-theme="day"] .star .label::after{content:"";position:absolute;right:-.72em;top:48%;width:5px;height:5px;border-radius:50%;
    background:#c98e28;box-shadow:0 0 0 1px rgba(255,249,204,.82),0 0 9px 3px rgba(255,219,102,.72);transform:translateY(-50%);opacity:.92}
  .star.visited .label{filter:saturate(1.15)}
  .mmu[data-theme="day"] .star.visited .label::before{opacity:.94;background:radial-gradient(ellipse,rgba(255,247,169,.95),rgba(255,222,102,.42) 46%,rgba(255,248,211,0) 76%)}
  .mmu[data-theme="day"] .star.visited .label::after{background:#f1aa25;box-shadow:0 0 0 1px #fffbd8,0 0 15px 6px rgba(255,202,48,.86)}
  .mmu[data-theme="night"] .star.visited .label{text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 23px rgba(225,248,153,.95),0 0 42px rgba(161,223,123,.72)}
  .star.soon{color:var(--faint)}
  .star.soon:not(.unlocked){opacity:.38;filter:grayscale(.35)}
  .star.soon.unlocked{opacity:1;filter:none}
  .mmu[data-theme="night"] .star{color:#e4efdc}
  .mmu[data-theme="night"] .star .label{font-weight:500;text-shadow:0 1px 9px rgba(2,10,8,.8),0 0 18px rgba(220,241,164,.52)}
  @keyframes float{0%,100%{margin-top:0}50%{margin-top:-10px}}

  .s1{top:21%;left:22%;animation-delay:0s}
  .s2{top:35%;left:22%;animation-delay:1.2s}
  .s4{top:38%;left:75%;animation-delay:1.8s}.s4 .label{font-family:var(--sans);letter-spacing:.06em}
  .s5{top:69%;left:30%;animation-delay:.9s}
  .s6{top:76%;left:72%;animation-delay:2.1s}
  /* 只有「先了解我」作为入口锚点略大一号,其余星球统一走 .star 的字号 */
  .s7{top:60%;left:55%;animation-delay:1.5s}.s7 .label{font-size:.92rem;letter-spacing:.18em;font-weight:500}
  .mmu[data-theme="night"] .s7 .label{color:#f3f7dc}

  .garden-intro{position:absolute;z-index:3;top:11%;left:50%;width:80vw;transform:translate(-50%,-50%);text-align:center;
    color:rgba(37,69,43,.78);text-shadow:0 1px 2px rgba(255,255,244,.98),0 0 12px rgba(255,255,225,.86)}
  .garden-intro strong{display:block;margin-bottom:.35rem;font-size:.9rem;font-weight:400;letter-spacing:.1em}
  .garden-intro span{display:block;font-family:var(--sans);font-size:.64rem;line-height:1.6;letter-spacing:.03em}
  /* 建议游览顺序:常驻可见,和上面的欢迎语拉开一点距离 */
  /* 手机上这行会折成两行,压紧行距并上移 intro,免得压到「人生 Wiki」那颗星 */
  .garden-intro .tour-order{margin-top:.6rem;padding-top:.5rem;font-size:.58rem;line-height:1.5;letter-spacing:.02em;opacity:.82;
    border-top:1px solid rgba(80,110,80,.18);display:inline-block}
  .mmu[data-theme="night"] .garden-intro{color:rgba(225,238,215,.82);text-shadow:0 1px 8px rgba(0,0,0,.9),0 0 20px rgba(164,205,139,.35)}

  .foot{position:absolute;z-index:3;bottom:.9rem;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--sans);font-size:.68rem;letter-spacing:.08em;color:var(--ink-soft);padding:.4rem .7rem;border-radius:99px;
    background:rgba(246,250,242,.34);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(6px)}
  .mmu[data-theme="night"] .foot{background:rgba(7,23,18,.25)}
  .desktop-hatch{display:block;margin-top:.5rem;font-size:.64rem;color:var(--faint);text-decoration:underline}

  /* 新人引导:下一个推荐的星球轻轻呼吸发光 + 底部一行小字。全部逛过就自动消失。 */
  .star.guide-next::after{content:"";position:absolute;inset:-8%;border-radius:999px;z-index:-1;pointer-events:none;
    border:1px solid rgba(255,206,92,.7);box-shadow:0 0 18px 4px rgba(255,206,92,.34);
    animation:guidePulse 2.6s ease-in-out infinite}
  @keyframes guidePulse{0%,100%{opacity:.3;transform:scale(.96)}50%{opacity:1;transform:scale(1.07)}}
  .guide-hint{position:absolute;z-index:4;bottom:4.6rem;left:50%;transform:translateX(-50%);white-space:nowrap;
    font-family:var(--sans);font-size:.68rem;letter-spacing:.08em;color:var(--ink-soft);padding:.38rem .8rem;border-radius:99px;
    background:rgba(246,250,242,.5);border:1px solid rgba(255,255,255,.28);backdrop-filter:blur(6px)}
  .mmu[data-theme="night"] .guide-hint{background:rgba(7,23,18,.34)}
  @media (prefers-reduced-motion:reduce){.star.guide-next::after{animation:none;opacity:.85}}

  /* Bottom sheet:替代桌面版的浮动窗口 */
  .sheet-backdrop{position:fixed;inset:0;z-index:29;background:rgba(10,20,14,.32);
    opacity:0;pointer-events:none;transition:opacity .25s}
  .sheet-backdrop.show{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:30;max-height:82vh;
    border-radius:20px 20px 0 0;overflow:hidden;display:flex;flex-direction:column;
    background:var(--win);border:1px solid var(--win-line);border-bottom:none;
    backdrop-filter:blur(14px);box-shadow:0 -12px 40px rgba(20,40,30,.28);
    transform:translateY(100%);transition:transform .28s cubic-bezier(.32,.72,0,1)}
  .sheet.open{transform:translateY(0)}
  .sheet.dragging{transition:none}
  .sheet-handle{display:flex;justify-content:center;padding:.6rem 0 .3rem;touch-action:none}
  .sheet-handle .grip{width:36px;height:4px;border-radius:99px;background:var(--win-line)}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:.2rem 1.1rem .7rem;border-bottom:1px solid var(--win-line);touch-action:none}
  .sheet-head .ttl{font-family:var(--serif);font-size:1.02rem;letter-spacing:.03em;color:var(--ink)}
  .sheet-head .x{font-family:var(--sans);font-size:1rem;line-height:1;color:var(--ink-soft);background:none;border:none;cursor:pointer;padding:.3em .5em;border-radius:6px}
  .sheet .body{padding:1.1rem 1.2rem calc(1.6rem + env(safe-area-inset-bottom));
    overflow-y:auto;-webkit-overflow-scrolling:touch;font-size:.97rem;line-height:1.78;color:var(--ink)}
  .sheet.embed .body{padding:0;overflow:hidden;background:#080b09}
  .sheet .kicker{font-family:var(--sans);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
  .sheet .lead{margin:.35rem 0 1rem;font-size:1rem;line-height:1.6}
  .preview{padding:.8rem .85rem;border:1px solid var(--win-line);border-radius:12px;background:rgba(255,255,255,.18)}
  .preview+.preview{margin-top:.6rem}
  .preview-title{font-size:.94rem;line-height:1.5}
  .preview-meta{margin-top:.25rem;font-family:var(--sans);font-size:.7rem;color:var(--faint)}
  .trail{display:grid;gap:.5rem;margin-top:.3rem}
  .trail-row{display:grid;grid-template-columns:4.2rem 1fr;gap:.6rem;padding-bottom:.45rem;border-bottom:1px solid var(--win-line)}
  .trail-row:last-child{padding-bottom:0;border-bottom:0}.trail-key{font-family:var(--sans);font-size:.72rem;color:var(--faint)}
  .bubble{max-width:88%;padding:.6rem .78rem;border-radius:12px;background:rgba(127,159,119,.13);line-height:1.6}
  .bubble.me{margin-left:auto;background:rgba(255,255,255,.28)}.bubble+.bubble{margin-top:.5rem}
  .chatlog{display:flex;flex-direction:column;max-height:38vh;overflow-y:auto;padding-right:.2rem}
  .chat-prompts{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}
  .prompt-chip{font-family:var(--sans);font-size:.72rem;line-height:1.35;color:var(--ink-soft);background:rgba(255,255,255,.18);border:1px solid var(--win-line);border-radius:99px;padding:.36rem .6rem}
  .chatbar{display:flex;gap:.5rem;margin-top:.85rem}
  .chatbar input{flex:1;font-family:var(--sans);font-size:.9rem;color:var(--ink);background:rgba(255,255,255,.28);border:1px solid var(--win-line);border-radius:2rem;padding:.55em .9em;outline:none}
  .mmu[data-theme="night"] .chatbar input{background:rgba(255,255,255,.08)}
  .chatbar button{font-family:var(--sans);font-size:.85rem;color:var(--ink);background:rgba(127,159,119,.22);border:1px solid var(--win-line);border-radius:2rem;padding:.55em 1.05em}
  .chatbar button:disabled{opacity:.5}
  /* 免费模型有时要等好几秒。动起来的等待比一句静止的"正在想…"体感短很多。 */
  .bubble.typing{opacity:.75;font-style:italic;display:flex;align-items:center;gap:.5rem}
  .bubble.typing .dots{display:inline-flex;gap:3px}
  .bubble.typing .dots i{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.35;
    animation:twinDot 1.25s ease-in-out infinite}
  .bubble.typing .dots i:nth-child(2){animation-delay:.18s}
  .bubble.typing .dots i:nth-child(3){animation-delay:.36s}
  @keyframes twinDot{0%,100%{opacity:.25;transform:translateY(0)}45%{opacity:.95;transform:translateY(-3px)}}
  .tags{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.75rem}.tag{font-family:var(--sans);font-size:.68rem;color:var(--ink-soft);border:1px solid var(--win-line);border-radius:99px;padding:.2rem .5rem}
  .sheet .go{display:inline-block;margin-top:1rem;font-family:var(--sans);font-size:.85rem;letter-spacing:.06em;
    color:var(--ink);text-decoration:none;border:1px solid var(--win-line);border-radius:2rem;padding:.5em 1.2em}
  .site-frame{display:block;width:100%;height:auto;aspect-ratio:9 / 16;border:0;background:#080b09}
</style>
</head>
<body>

<div class="mmu tour-started" id="mmu" data-theme="day">
  <div class="bg bg-day"></div>
  <div class="bg bg-night"></div>

  <header class="top">
    <div class="ctrl"><button id="theme" type="button">☾ 夜间</button></div>
  </header>

  <div class="garden-intro" aria-label="游园介绍">
    <strong>这里是梅梅的游园会。</strong>
    <span>我把活过、想过、做过，以及还在长出来的东西放在这里。</span>
    <span>点开画面里的词，随便逛逛。</span>
    <span class="tour-order">没头绪的话，这样逛：先了解我 → 和梅梅聊天 → 人生 Wiki / 问题沙龙 → Life OS</span>
  </div>

  <div class="sky" id="sky">
    <a class="star s1" data-app="wiki" href="#"><span class="label">人生 Wiki</span></a>
    <a class="star s2" data-app="salon" href="#"><span class="label">问题沙龙</span></a>
    <a class="star s4" data-app="life" href="#"><span class="label">Life OS</span></a>
    <a class="star s5" data-app="twin" href="#"><span class="label">和梅梅聊天</span></a>
    <a class="star s6 soon" data-app="soon" href="#" aria-disabled="true"><span class="label">下一颗星</span></a>
    <a class="star s7" data-app="intro" href="#"><span class="label">先了解我</span></a>
  </div>

  <p class="guide-hint" id="guideHint" hidden></p>

  <p class="foot" id="foot">把我带回自己身上。<a class="desktop-hatch" href="index.html?desktop=1">查看电脑版</a></p>
</div>

<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-handle" id="sheetHandle"><span class="grip"></span></div>
  <div class="sheet-head"><span class="ttl" id="sheetTitle"></span><button class="x" id="sheetClose" aria-label="关闭">✕</button></div>
  <div class="body" id="sheetBody"></div>
</div>

<script>
(function(){
  var mmu=document.getElementById('mmu'), sky=document.getElementById('sky'),
      sheet=document.getElementById('sheet'), backdrop=document.getElementById('backdrop'),
      sheetTitle=document.getElementById('sheetTitle'), sheetBody=document.getElementById('sheetBody'),
      sheetClose=document.getElementById('sheetClose'), sheetHandle=document.getElementById('sheetHandle'),
      sheetHead=document.querySelector('.sheet-head'), guideHint=document.getElementById('guideHint');

  // 新人建议路线:先认识人 → 聊两句 → 想往深里看再进 Wiki/沙龙 → 最后才是 Life OS
  var GUIDE=['intro','twin','wiki','salon','life'];
  var GUIDE_LABEL={intro:'先了解我',twin:'和梅梅聊天',wiki:'人生 Wiki',salon:'问题沙龙',life:'Life OS'};

  var CORE=['intro','wiki','salon','twin','life'], visited=[];
  try{ visited=JSON.parse(localStorage.getItem('mmu-visited-v1')||'[]'); }catch(e){ visited=[]; }
  if(!Array.isArray(visited)) visited=[];

  function saveVisited(){ try{ localStorage.setItem('mmu-visited-v1',JSON.stringify(visited)); }catch(e){} }
  function updateGarden(){
    sky.querySelectorAll('.star').forEach(function(s){
      s.classList.toggle('visited',visited.indexOf(s.getAttribute('data-app'))>-1);
    });
    var unlocked=CORE.every(function(k){return visited.indexOf(k)>-1;}), next=sky.querySelector('.s6');
    next.classList.toggle('unlocked',unlocked);
    next.setAttribute('aria-disabled',unlocked?'false':'true');
    updateGuide();
  }
  // 引导:把光标停在建议路线上第一个还没点过的星球
  function updateGuide(){
    sky.querySelectorAll('.star').forEach(function(s){ s.classList.remove('guide-next'); });
    var nextKey=null;
    for(var i=0;i<GUIDE.length;i++){ if(visited.indexOf(GUIDE[i])<0){ nextKey=GUIDE[i]; break; } }
    if(!nextKey){ guideHint.hidden=true; return; }   // 都逛过了就不再打扰
    var el=sky.querySelector('[data-app="'+nextKey+'"]');
    if(el) el.classList.add('guide-next');
    guideHint.hidden=false;
    guideHint.textContent=visited.length===0
      ? '没头绪的话，从「'+GUIDE_LABEL[nextKey]+'」开始'
      : '接下来可以看「'+GUIDE_LABEL[nextKey]+'」';
  }
  function markVisited(key){
    if(CORE.indexOf(key)>-1&&visited.indexOf(key)<0){visited.push(key);saveVisited();updateGarden();}
  }
  updateGarden();

  // 数字分身后端地址,和桌面版共用同一个 Worker
  var TWIN_API="https://meimei-twin.meixingyu001.workers.dev";

  // 内容和桌面版 APPS 保持一致,文案改动请两边同步
  var APPS={
    intro:{t:'先了解我', embed:true, b:'<iframe class="site-frame" src="https://personal-homepage-website-henna.vercel.app/" title="梅梅的个人主页" loading="eager"></iframe>'},
    wiki:{t:'人生 Wiki', b:'<div class="kicker">PUBLIC WIKI · 分类结构</div><p class="lead">我真的活过的证据，按这些类目长在一起。这是脱敏后的公开投影，完整版只留在私人 Wiki 里。</p><div class="preview trail"><div class="trail-row"><span class="trail-key">编年史</span><span>按年份铺开的时间线</span></div><div class="trail-row"><span class="trail-key">场域</span><span>待过的地方与它们的气味</span></div><div class="trail-row"><span class="trail-key">作品</span><span>写的、拍的、造的</span></div><div class="trail-row"><span class="trail-key">命题</span><span>反复回来的那几个问题</span></div></div><a class="go" href="wiki/" target="_blank" rel="noopener">进入人生 Wiki ↗</a>'},
    salon:{t:'问题沙龙', b:'<div class="kicker">会客厅 · QUESTION SALON</div><p class="lead">带着一个真问题，邀请有鲜明方法论的人一起学习、判断或创造。</p><div class="preview"><div class="preview-meta">下一张桌</div><div class="preview-title">开一张 Life OS 产品桌。请产品、技术、设计、营销领域里方法论差异鲜明的人来，用我目前的真实系统和材料过堂。</div></div><div class="tags"><span class="tag">自由之桌</span><span class="tag">钱之桌</span><span class="tag">不确定性之桌</span></div><a class="go" href="salon.html" target="_blank" rel="noopener">进入问题沙龙 ↗</a>'},
    twin:{t:'和梅梅聊天', b:'<div class="kicker">和梅梅聊天 · 数字分身</div><p class="lead">我是数字梅梅，先来聊两句，感受一下合不合拍。</p><p class="note">它跑在免费模型上，回答可能要等几秒，别急。</p><div class="chatlog" id="twinlog"><div class="bubble">嗨，我是数字梅梅。你可以直接问，也可以从下面挑一句。</div></div><div class="chat-prompts" aria-label="示例问题"><button class="prompt-chip" type="button" data-prompt="Life OS 对梅梅来说是什么？">什么是 Life OS？</button><button class="prompt-chip" type="button" data-prompt="梅梅怎么看不上班和自由？">聊聊不上班</button><button class="prompt-chip" type="button" data-prompt="我适合找真人梅梅聊什么？">我适合找她聊什么？</button></div><form class="chatbar" id="twinform"><input id="twinput" autocomplete="off" placeholder="说点什么…"><button type="submit">发</button></form>'},
    life:{t:'Life OS', b:'<div class="kicker">GREENHOUSE / TOOL SHED</div><p class="lead">这里不放“我是谁”的结论。放的是我怎么把这一切做出来。</p><div class="preview trail"><div class="trail-row"><span class="trail-key">底座</span><span>人生 Wiki、原话语料、证据页与冷库</span></div><div class="trail-row"><span class="trail-key">运转</span><span>数字分身、会客厅、灵感 Inbox、写作流水线</span></div><div class="trail-row"><span class="trail-key">方向</span><span>先服务于我，再成为作品，再成为对外产品</span></div></div><a class="go" href="talk.html" target="_blank" rel="noopener">打开 Life OS 演示 ↗</a>'},

  function openApp(key){
    var a=APPS[key]; if(!a) return;
    sheet.classList.toggle('embed', !!a.embed);
    sheetTitle.textContent=a.t; sheetBody.innerHTML=a.b;
    sheet.style.transform='';
    requestAnimationFrame(function(){
      sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false'); backdrop.classList.add('show');
    });
    if(key==='twin') initTwin(sheet);
  }
  function closeSheet(){
    sheet.classList.remove('open'); backdrop.classList.remove('show'); sheet.setAttribute('aria-hidden','true');
  }
  sheetClose.addEventListener('click', closeSheet);
  backdrop.addEventListener('click', closeSheet);

  sky.addEventListener('click', function(e){
    var s=e.target.closest('.star'); if(!s) return; e.preventDefault();
    var key=s.getAttribute('data-app');
    if(key==='soon'&&!s.classList.contains('unlocked')){ openApp('locked'); return; }
    markVisited(key);
    openApp(key);
  });

  // 数字分身聊天:逻辑和桌面版一致,只是挂在 sheet 上而不是 .win 窗口
  function initTwin(w){
    var log=w.querySelector('#twinlog'), form=w.querySelector('#twinform'),
        inp=w.querySelector('#twinput'), btn=form.querySelector('button'), history=[];
    function add(role,text){
      var b=document.createElement('div');
      b.className='bubble'+(role==='user'?' me':'');
      b.textContent=text; log.appendChild(b); log.scrollTop=log.scrollHeight; return b;
    }
    w.querySelectorAll('.prompt-chip').forEach(function(chip){
      chip.addEventListener('click', function(){
        if(btn.disabled) return;
        inp.value=chip.getAttribute('data-prompt')||chip.textContent;
        btn.click();
      });
    });
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var text=inp.value.trim(); if(!text) return;
      add('user',text); history.push({role:'user',content:text});
      inp.value=''; inp.focus(); btn.disabled=true;
      if(!TWIN_API){ add('assistant','(分身马上接上线,先喝口水~)'); btn.disabled=false; return; }
      var typing=add('assistant','数字梅梅正在想'); typing.classList.add('typing');
      typing.innerHTML='数字梅梅正在想<span class="dots"><i></i><i></i><i></i></span>';
      // 等久了换句话,让人知道还在跑,不是卡死了
      var waitTimer=setTimeout(function(){
        typing.innerHTML='还在想，稍等一下<span class="dots"><i></i><i></i><i></i></span>';
      },6000);
      fetch(TWIN_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history})})
        .then(function(r){return r.json();})
        .then(function(d){
          clearTimeout(waitTimer); typing.remove();
          var reply=d.reply||d.error||'……(卡了一下,再说一次?)';
          add('assistant',reply); history.push({role:'assistant',content:reply});
        })
        .catch(function(){ clearTimeout(waitTimer); typing.remove(); add('assistant','(我这边断线了,待会儿再聊?)'); })
        .finally(function(){ btn.disabled=false; });
    });
  }

  // 下滑关闭手势:绑在把手和标题栏区域,不含正文(避免和聊天记录滚动冲突)
  (function(){
    var startY=0, curY=0, dragging=false, sheetH=0;
    function onStart(e){ dragging=true; startY=curY=e.touches[0].clientY; sheetH=sheet.offsetHeight; sheet.classList.add('dragging'); }
    function onMove(e){
      if(!dragging) return; curY=e.touches[0].clientY;
      var dy=Math.max(0,curY-startY); sheet.style.transform='translateY('+dy+'px)'; e.preventDefault();
    }
    function onEnd(){
      if(!dragging) return; dragging=false; sheet.classList.remove('dragging');
      var dy=Math.max(0,curY-startY);
      if(dy>Math.min(sheetH*0.25,140)) closeSheet(); else sheet.style.transform='';
    }
    [sheetHandle, sheetHead].forEach(function(el){
      el.addEventListener('touchstart', onStart, {passive:true});
    });
    window.addEventListener('touchmove', onMove, {passive:false});
    window.addEventListener('touchend', onEnd);
  })();

  // 白天 / 夜间
  var tb=document.getElementById('theme');
  tb.addEventListener('click', function(){
    var night=mmu.getAttribute('data-theme')==='night';
    mmu.setAttribute('data-theme', night?'day':'night');
    tb.textContent=night?'☾ 夜间':'☀ 白天';
  });
})();
</script>
